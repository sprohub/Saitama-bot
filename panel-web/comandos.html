<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saitama Bot · Panel de comandos</title>
<style>
  :root {
    --amarillo: #f4c430;
    --rojo: #d92c27;
    --fondo: #0b0c0f;
    --panel: #14161b;
    --borde: rgba(255,255,255,0.08);
    --blanco: #f5f6f8;
    --gris: #7d8590;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--blanco);
    font-family: var(--sans);
    min-height: 100vh;
  }

  header {
    position: sticky;
    top: 0;
    background: rgba(11,12,15,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--borde);
    padding: 20px 24px;
    z-index: 10;
  }

  .marca {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }

  .marca .s { color: var(--amarillo); font-weight: 900; }
  .marca .b { color: var(--rojo); font-weight: 900; }
  .marca h1 { font-size: 22px; margin: 0; letter-spacing: 0.5px; }

  .estado {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--gris);
  }

  .pulso {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--amarillo);
    box-shadow: 0 0 0 0 rgba(244,196,48,0.6);
    animation: latido 2s infinite;
  }

  .pulso.error { background: var(--rojo); animation: none; }

  @keyframes latido {
    0%   { box-shadow: 0 0 0 0 rgba(244,196,48,0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(244,196,48,0); }
    100% { box-shadow: 0 0 0 0 rgba(244,196,48,0); }
  }

  .buscador {
    margin-top: 14px;
  }

  .buscador input {
    width: 100%;
    max-width: 420px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 10px;
    color: var(--blanco);
    font-size: 14px;
    outline: none;
  }

  .buscador input:focus {
    border-color: var(--amarillo);
  }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }

  .contador {
    color: var(--gris);
    font-size: 13px;
    margin: 0 0 20px;
    letter-spacing: 0.3px;
  }

  .contador strong { color: var(--blanco); }

  .categoria {
    margin-bottom: 32px;
  }

  .categoria h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--gris);
    font-weight: 600;
    margin: 0 0 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--borde);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .tarjeta {
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 16px 18px;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .tarjeta:hover {
    border-color: rgba(244,196,48,0.35);
    transform: translateY(-2px);
  }

  .comandos {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  .comando {
    font-family: var(--mono);
    font-size: 12.5px;
    background: rgba(244,196,48,0.1);
    color: var(--amarillo);
    padding: 3px 9px;
    border-radius: 6px;
    border: 1px solid rgba(244,196,48,0.2);
  }

  .descripcion {
    font-size: 13.5px;
    color: #c7cbd1;
    line-height: 1.45;
    margin: 0 0 8px;
  }

  .archivo {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gris);
  }

  .vacio {
    text-align: center;
    color: var(--gris);
    padding: 60px 20px;
    font-size: 14px;
  }

  .nuevo-flash {
    animation: destello 1.4s ease;
  }

  @keyframes destello {
    0%   { box-shadow: 0 0 0 2px var(--amarillo); }
    100% { box-shadow: 0 0 0 0 rgba(244,196,48,0); }
  }
</style>
</head>
<body>

<header>
  <div class="marca">
    <h1><span class="s">SAITAMA</span> <span class="b">BOT</span></h1>
  </div>
  <div class="estado">
    <span class="pulso" id="pulso"></span>
    <span id="textoEstado">Conectando…</span>
  </div>
  <div class="buscador">
    <input type="text" id="buscador" placeholder="Buscar comando, categoría o descripción…">
  </div>
</header>

<main>
  <p class="contador" id="contador"></p>
  <div id="contenido"></div>
</main>

<script>
  const INTERVALO_MS = 5000
  let ultimosArchivos = new Set()
  let primeraCarga = true

  function escapar(texto) {
    const div = document.createElement('div')
    div.textContent = texto ?? ''
    return div.innerHTML
  }

  function agruparPorTag(comandos) {
    const grupos = {}
    for (const c of comandos) {
      const tags = c.tags && c.tags.length ? c.tags : ['sin-categoria']
      for (const tag of tags) {
        if (!grupos[tag]) grupos[tag] = []
        grupos[tag].push(c)
      }
    }
    return grupos
  }

  function renderizar(comandos) {
    const filtro = document.getElementById('buscador').value.trim().toLowerCase()

    const filtrados = comandos.filter((c) => {
      if (!filtro) return true
      const texto = [
        c.archivo,
        c.descripcion,
        ...(c.comandos || []),
        ...(c.tags || [])
      ].join(' ').toLowerCase()
      return texto.includes(filtro)
    })

    const contenedor = document.getElementById('contenido')
    document.getElementById('contador').innerHTML =
      `<strong>${comandos.length}</strong> comando(s) cargado(s)` +
      (filtro ? ` · mostrando ${filtrados.length}` : '')

    if (filtrados.length === 0) {
      contenedor.innerHTML = `<div class="vacio">No hay comandos que coincidan con "${escapar(filtro)}".</div>`
      return
    }

    const grupos = agruparPorTag(filtrados)
    const nombresGrupos = Object.keys(grupos).sort()

    contenedor.innerHTML = nombresGrupos.map((tag) => `
      <section class="categoria">
        <h2>${escapar(tag)} · ${grupos[tag].length}</h2>
        <div class="grid">
          ${grupos[tag].map((c) => `
            <article class="tarjeta ${!ultimosArchivos.has(c.archivo) && !primeraCarga ? 'nuevo-flash' : ''}">
              <div class="comandos">
                ${(c.comandos.length ? c.comandos : ['(sin comando)']).map((cmd) => `<span class="comando">.${escapar(cmd)}</span>`).join('')}
              </div>
              ${c.descripcion ? `<p class="descripcion">${escapar(c.descripcion)}</p>` : ''}
              <div class="archivo">${escapar(c.archivo)}</div>
            </article>
          `).join('')}
        </div>
      </section>
    `).join('')
  }

  async function actualizar() {
    const pulso = document.getElementById('pulso')
    const textoEstado = document.getElementById('textoEstado')

    try {
      const res = await fetch('/api/comandos', { cache: 'no-store' })
      if (!res.ok) throw new Error('Respuesta no válida')
      const data = await res.json()

      renderizar(data.comandos || [])

      pulso.classList.remove('error')
      const hora = new Date(data.actualizado).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      textoEstado.textContent = `En vivo · actualizado a las ${hora}`

      ultimosArchivos = new Set((data.comandos || []).map((c) => c.archivo))
      primeraCarga = false
    } catch (e) {
      pulso.classList.add('error')
      textoEstado.textContent = 'Sin conexión con el bot — reintentando…'
    }
  }

  document.getElementById('buscador').addEventListener('input', () => {
    fetch('/api/comandos', { cache: 'no-store' })
      .then((r) => r.json())
      .then((data) => renderizar(data.comandos || []))
      .catch(() => {})
  })

  actualizar()
  setInterval(actualizar, INTERVALO_MS)
</script>

</body>
</html>
